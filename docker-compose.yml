services:
  climate-monitoring-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: climate-monitoring-web:local
    container_name: climate-monitoring-web
    restart: unless-stopped
    ports:
      - "4200:8080"
    environment:
      BACKEND_HOST: "${BACKEND_HOST:-gateway:8080}"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  frontend:
  backend:
    external: true
    name: climate-monitoring_backend
