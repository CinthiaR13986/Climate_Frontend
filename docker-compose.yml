services:
  climate-monitoring-web:
    build: .
    image: climate/frontend:phase2
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    environment:
      GATEWAY_PUBLIC_URL: "${GATEWAY_PUBLIC_URL:-http://localhost:8080}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
