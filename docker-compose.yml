services:
  climate-monitoring-web:
    build: .
    image: climate/frontend:phase2
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      GATEWAY_PUBLIC_URL: "https://${CLIMATE_DOMAIN:-analisissistemas2026proyecto.xyz}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
