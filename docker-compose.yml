services:
  climate-monitoring-web:
    build: .
    image: climate/frontend:phase2
    restart: unless-stopped
    environment:
      GATEWAY_PUBLIC_URL: "https://${CLIMATE_DOMAIN:-analisissistemas2026proyecto.xyz}"
      GATEWAY_INTERNAL_URL: http://host.docker.internal:18080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - traefik.enable=true
      - traefik.http.routers.climate-web.rule=Host(`${CLIMATE_DOMAIN:-analisissistemas2026proyecto.xyz}`)
      - traefik.http.routers.climate-web.entrypoints=websecure
      - traefik.http.routers.climate-web.tls=true
      - traefik.http.routers.climate-web.tls.certresolver=letsencrypt
      - traefik.http.services.climate-web.loadbalancer.server.port=8080
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
