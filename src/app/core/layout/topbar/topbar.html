<header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-slate-200 bg-white/95 px-4 backdrop-blur sm:px-6">
  <div class="flex min-w-0 items-center gap-3">
    <button type="button" class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-cyan-600 lg:hidden" aria-label="Abrir navegación" aria-controls="mobile-navigation" (click)="menuToggle.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="size-6"><path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <div class="min-w-0"><p class="truncate text-sm font-semibold text-slate-950 sm:text-base">{{ pageTitle() }}</p><p class="hidden text-xs text-slate-500 sm:block">Sistema de Monitoreo Climático</p></div>
  </div>
  <div class="relative">
    <button type="button" class="flex items-center gap-3 rounded-xl p-1.5 pr-2 text-left hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-cyan-600" [attr.aria-expanded]="userMenuOpen()" aria-haspopup="menu" (click)="userMenuOpen.update(value => !value)">
      <span class="grid size-9 place-items-center rounded-lg bg-cyan-700 text-sm font-semibold text-white" aria-hidden="true">{{ authStore.currentUser()?.username?.charAt(0)?.toUpperCase() ?? 'U' }}</span>
      <span class="hidden sm:block"><span class="block max-w-36 truncate text-sm font-medium text-slate-800">{{ authStore.currentUser()?.username ?? 'Usuario' }}</span><span class="block text-xs text-slate-500">{{ authStore.role() ?? 'Sin rol' }}</span></span>
      <svg viewBox="0 0 20 20" fill="currentColor" class="hidden size-4 text-slate-400 sm:block" aria-hidden="true"><path fill-rule="evenodd" d="M5.3 7.3a1 1 0 0 1 1.4 0L10 10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 0-1.4Z" clip-rule="evenodd" /></svg>
    </button>
    @if (userMenuOpen()) {
      <div class="absolute right-0 mt-2 w-56 rounded-xl border border-slate-200 bg-white p-2 shadow-xl" role="menu">
        <div class="border-b border-slate-100 px-3 py-2"><p class="truncate text-sm font-medium text-slate-900">{{ authStore.currentUser()?.email }}</p><p class="mt-0.5 text-xs text-slate-500">Sesión protegida con JWT</p></div>
        <button type="button" class="mt-2 w-full rounded-lg px-3 py-2 text-left text-sm text-red-700 hover:bg-red-50 focus-visible:outline-2 focus-visible:outline-red-600" role="menuitem" (click)="logout()">Cerrar sesión</button>
      </div>
    }
  </div>
</header>
