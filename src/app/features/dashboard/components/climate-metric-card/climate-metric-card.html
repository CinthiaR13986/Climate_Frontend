<article class="h-full rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
  <div class="flex items-start justify-between gap-3">
    <div><p class="text-sm font-medium text-slate-500">{{ labels[type()] }}</p><p class="mt-3 text-3xl font-semibold tracking-tight text-slate-950">
      @if (reading(); as current) { {{ current.value | number:'1.0-2' }} <span class="text-base font-medium text-slate-500">{{ current.unit }}</span> } @else { <span aria-label="Sin datos">—</span> }
    </p></div>
    <span class="grid size-11 shrink-0 place-items-center rounded-xl bg-cyan-50 text-cyan-700" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-6">
        @switch (type()) {
          @case ('Temperature') { <path stroke-linecap="round" d="M14 14.8V5a3 3 0 0 0-6 0v9.8a5 5 0 1 0 6 0ZM11 6v10" /> }
          @case ('Humidity') { <path stroke-linecap="round" stroke-linejoin="round" d="M12 3S6 10 6 15a6 6 0 0 0 12 0c0-5-6-12-6-12Z" /> }
          @case ('WindSpeed') { <path stroke-linecap="round" d="M3 8h11a3 3 0 1 0-3-3M3 12h16a2.5 2.5 0 1 1-2.5 2.5M3 16h8" /> }
          @case ('Rainfall') { <path stroke-linecap="round" d="M7 16a4 4 0 1 1 1-7.9A5 5 0 0 1 17.8 10H19a3 3 0 0 1 0 6M8 19l-1 2m6-2-1 2m6-2-1 2" /> }
          @case ('WaterLevel') { <path stroke-linecap="round" d="M3 8c2 0 2 1.5 4 1.5S9 8 11 8s2 1.5 4 1.5S17 8 19 8s2 1.5 2 1.5M3 14c2 0 2 1.5 4 1.5S9 14 11 14s2 1.5 4 1.5S17 14 19 14s2 1.5 2 1.5" /> }
        }
      </svg>
    </span>
  </div>
  <p class="mt-5 text-xs text-slate-500">@if (reading(); as current) { Actualizado {{ current.recordedAt | date:'dd/MM/yyyy HH:mm' }} } @else { Sin lecturas disponibles }</p>
</article>
