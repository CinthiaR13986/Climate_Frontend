<div class="mx-auto max-w-2xl space-y-6"><header><a routerLink="/users" class="text-sm font-semibold text-cyan-800 hover:underline">← Volver a usuarios</a><h1 class="mt-3 text-3xl font-semibold">Editar usuario</h1><p class="mt-2 text-slate-600">Actualiza la identidad y el nivel de acceso.</p></header>@if (error()) { <div role="alert" class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800">{{ error() }}</div> }@if (loading()) { <div class="rounded-2xl bg-white p-10 text-center text-slate-500">Cargando formulario…</div> } @else { <form class="space-y-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm" [formGroup]="form" (ngSubmit)="save()"><label class="block text-sm font-medium text-slate-700">Usuario<input class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="username">@if (form.controls.username.touched && form.controls.username.invalid) { <span class="mt-1 block text-xs text-red-700">El nombre de usuario es obligatorio.</span> }</label><label class="block text-sm font-medium text-slate-700">Correo electrónico<input type="email" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="email">@if (form.controls.email.touched && form.controls.email.invalid) { <span class="mt-1 block text-xs text-red-700">Ingresa un correo electrónico válido.</span> }</label><label class="block text-sm font-medium text-slate-700">Rol<select class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5" formControlName="role">@for (role of roles; track role) { <option [value]="role">{{ roleLabels[role] }}</option> }</select></label><div class="flex justify-end gap-3 pt-2"><a routerLink="/users" class="rounded-xl px-4 py-2.5 font-semibold">Cancelar</a><button type="submit" class="rounded-xl bg-cyan-700 px-5 py-2.5 font-semibold text-white disabled:opacity-50" [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Guardar cambios' }}</button></div></form> }</div>
