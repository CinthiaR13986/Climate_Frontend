<div class="mx-auto max-w-4xl space-y-6"><header><a routerLink="/sensors" class="text-sm font-semibold text-cyan-800 hover:underline">← Volver a sensores</a><h1 class="mt-3 text-3xl font-semibold text-slate-950">{{ isEdit ? 'Editar sensor' : 'Nuevo sensor' }}</h1><p class="mt-2 text-slate-600">Los datos se guardan directamente en el Gateway.</p></header>
@if (error()) { <div role="alert" class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800">{{ error() }}</div> }
@if (loading()) { <div class="rounded-2xl border border-slate-200 bg-white p-10 text-center text-slate-500">Cargando formulario…</div> } @else { <form class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7" [formGroup]="form" (ngSubmit)="save()"><label class="block text-sm font-medium text-slate-700">Fecha de instalación<input type="date" formControlName="installationDate" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label><label class="block text-sm font-medium text-slate-700">Ubicación<input type="text" formControlName="location" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label><label class="block text-sm font-medium text-slate-700">Tipo ambiental adicional (para Otros)<input type="text" formControlName="environmentalType" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label><div class="grid gap-5 sm:grid-cols-2">
<label class="text-sm font-medium text-slate-700">Nombre<input class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="name">@if (form.controls.name.touched && form.controls.name.invalid) { <span class="mt-1 block text-xs text-red-700">El nombre es obligatorio.</span> }</label>
<label class="text-sm font-medium text-slate-700">Código<input class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="code">@if (form.controls.code.touched && form.controls.code.invalid) { <span class="mt-1 block text-xs text-red-700">El código es obligatorio.</span> }</label>
<label class="text-sm font-medium text-slate-700">Tipo<select class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5" formControlName="type">@for (type of types; track type) { <option [value]="type">{{ labels[type] }}</option> }</select></label>
<label class="text-sm font-medium text-slate-700">Unidad<input class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="unit">@if (form.controls.unit.touched && form.controls.unit.invalid) { <span class="mt-1 block text-xs text-red-700">La unidad es obligatoria.</span> }</label>
<label class="text-sm font-medium text-slate-700 sm:col-span-2">Comunidad<select class="mt-2 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5" formControlName="communityId"><option value="">Selecciona una comunidad</option>@for (community of communities(); track community.id) { <option [value]="community.id">{{ community.name }}</option> }</select>@if (form.controls.communityId.touched && form.controls.communityId.invalid) { <span class="mt-1 block text-xs text-red-700">La comunidad es obligatoria.</span> }</label>
<label class="text-sm font-medium text-slate-700">Latitud<input type="number" step="any" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="latitude"></label><label class="text-sm font-medium text-slate-700">Longitud<input type="number" step="any" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="longitude"></label>
<label class="text-sm font-medium text-slate-700 sm:col-span-2">Descripción<textarea rows="4" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="description"></textarea></label></div><div class="mt-7 flex justify-end gap-3"><a routerLink="/sensors" class="rounded-xl px-4 py-2.5 font-semibold text-slate-700">Cancelar</a><button type="submit" class="rounded-xl bg-cyan-700 px-5 py-2.5 font-semibold text-white disabled:opacity-50" [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Guardar sensor' }}</button></div></form> }</div>
