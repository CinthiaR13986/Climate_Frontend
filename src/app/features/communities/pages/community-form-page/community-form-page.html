<div class="mx-auto max-w-3xl space-y-6"><header><a routerLink="/communities" class="text-sm font-semibold text-cyan-800 hover:underline">← Volver a comunidades</a><h1 class="mt-3 text-3xl font-semibold text-slate-950">{{ isEdit ? 'Editar comunidad' : 'Nueva comunidad' }}</h1><p class="mt-2 text-slate-600">Registra su ubicación geográfica y estado operativo.</p></header>
@if (error()) { <div role="alert" class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800">{{ error() }}</div> }
@if (loading()) { <div class="rounded-2xl border border-slate-200 bg-white p-10 text-center text-slate-500">Cargando formulario…</div> } @else { <form class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7" [formGroup]="form" (ngSubmit)="save()"><label class="block text-sm font-medium text-slate-700">Municipio<input type="text" formControlName="municipality" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label><label class="block text-sm font-medium text-slate-700">Departamento<input type="text" formControlName="department" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label><label class="block text-sm font-medium text-slate-700">País<input type="text" formControlName="country" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5"></label><div class="grid gap-5 sm:grid-cols-2"><label class="text-sm font-medium text-slate-700 sm:col-span-2">Nombre<input class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="name">@if (form.controls.name.touched && form.controls.name.invalid) { <span class="mt-1 block text-xs text-red-700">El nombre es obligatorio.</span> }</label><label class="text-sm font-medium text-slate-700">Latitud<input type="number" step="any" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="latitude">@if (form.controls.latitude.touched && form.controls.latitude.invalid) { <span class="mt-1 block text-xs text-red-700">Usa un valor entre -90 y 90.</span> }</label><label class="text-sm font-medium text-slate-700">Longitud<input type="number" step="any" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="longitude">@if (form.controls.longitude.touched && form.controls.longitude.invalid) { <span class="mt-1 block text-xs text-red-700">Usa un valor entre -180 y 180.</span> }</label><label class="text-sm font-medium text-slate-700 sm:col-span-2">Descripción<textarea rows="4" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5" formControlName="description"></textarea></label>@if (isEdit) { <label class="flex items-center gap-3 rounded-xl bg-slate-50 p-4 text-sm font-medium text-slate-700 sm:col-span-2"><input type="checkbox" class="size-4" formControlName="isActive"> Comunidad activa</label> }</div><div class="mt-7 flex justify-end gap-3"><a routerLink="/communities" class="rounded-xl px-4 py-2.5 font-semibold text-slate-700">Cancelar</a><button type="submit" class="rounded-xl bg-cyan-700 px-5 py-2.5 font-semibold text-white disabled:opacity-50" [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Guardar comunidad' }}</button></div></form> }</div>
