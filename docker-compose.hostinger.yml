# Combine with docker-compose.yml. Requires the Hostinger Traefik project.
services:
  climate-monitoring-web:
    ports: !reset []
    environment:
      GATEWAY_PUBLIC_URL: https://${CLIMATE_DOMAIN:-analisissistemas2026proyecto.xyz}
      GATEWAY_INTERNAL_URL: http://gateway:8080
    networks:
      - default
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.climate-web.rule=Host(`${CLIMATE_DOMAIN:-analisissistemas2026proyecto.xyz}`)
      - traefik.http.routers.climate-web.entrypoints=websecure
      - traefik.http.routers.climate-web.tls=true
      - traefik.http.routers.climate-web.tls.certresolver=letsencrypt
      - traefik.http.routers.climate-web.service=climate-web
      - traefik.http.services.climate-web.loadbalancer.server.port=8080
      - traefik.http.routers.climate-http.rule=Host(`${CLIMATE_DOMAIN:-analisissistemas2026proyecto.xyz}`)
      - traefik.http.routers.climate-http.entrypoints=web
      - traefik.http.routers.climate-http.middlewares=climate-https
      - traefik.http.routers.climate-http.service=climate-web
      - traefik.http.middlewares.climate-https.redirectscheme.scheme=https
      - traefik.http.middlewares.climate-https.redirectscheme.permanent=true

networks:
  default:
    name: climate-monitoring-frontend
  backend:
    external: true
    name: climate-monitoring-backend
